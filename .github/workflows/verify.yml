name: Build and privacy checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Native build
        run: zsh build.sh
      - name: Dates and reminders
        run: zsh test.sh
      - name: Document and screenshot import
        run: zsh verify-import.sh
      - name: GitHub, Git and secret protection
        run: zsh verify-homework.sh
      - name: Official login protection
        run: zsh verify-github-cli.sh
      - name: Recovery, diagnostics and storage
        run: zsh verify-quality.sh
      - name: Recognition and review state
        run: zsh verify-recognition.sh
      - name: Forms and course UI
        run: |
          zsh verify-forms.sh
          zsh verify-course-ui.sh
      - name: Isolated graphical regressions (PASS required)
        run: |
          zsh verify-hybrid-ui.sh
          AM_UI_TEST=SkillExchange zsh verify-hybrid-ui.sh
          AM_UI_TEST=QualityUsage zsh verify-hybrid-ui.sh
      - name: Compile local image privacy scanner
        run: >-
          clang -fobjc-arc -Wall -Wextra -Werror -mmacosx-version-min=13.0
          -framework Foundation -framework Vision Tools/PrivacyOCR.m -o build/tests/privacy-ocr
      - name: Update and safe exit regression
        run: zsh verify-update.sh
      - name: Image metadata and binary audit regression
        run: python3 Tests/SecurityAuditTests.py
      - name: Current files, full history, archives and screenshots
        run: python3 Tools/security-audit.py --history --artifacts "build/AM's Homework Helper.app" --ocr build/tests/privacy-ocr
